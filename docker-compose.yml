services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hubspot_order_sync
      POSTGRES_USER: hubspot
      POSTGRES_PASSWORD: hubspot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubspot -d hubspot_order_sync"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
